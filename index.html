<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Website</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      -webkit-overflow-scrolling: touch;
    }
    .iframe-crop-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-crop-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-crop-box">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbwXqmQp7Z70b7fPlrs6cm5SNyo7xSO6oYY52XimHRZ593UyjDxtVzczXrB8wVUBbG1-Hw/exec" 
      allow="camera *; microphone *; geolocation *; clipboard-write *; fullscreen *">
    </iframe>
  </div>
</body>
</html>
